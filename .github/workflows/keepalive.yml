# Supabase Free pauses a project after a week without requests.
# One tiny query a day keeps it awake.
# GitHub turns scheduled jobs off after 60 days without repository activity. The second
# job re-enables this workflow and the weekly backup every day, which restarts that
# 60-day count without commits. If it ever stops anyway, press "Enable workflow" in Actions.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'   # every day, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            'https://gsfsyfeytrlmgbhdrunx.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_LwR8qCvWs6lLR1ALoTHCjw_9B4VQ-W8' \
            -H 'Content-Type: application/json' -d '{}')
          echo "Supabase answered $code"
          test "$code" = "200"

  stay-enabled:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keepalive.yml backup.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "$wf enabled"
          done
