# Supabase Free pauses a project after a week without requests.
# One tiny query a day keeps it awake. GitHub turns scheduled jobs off after
# 60 days without commits; if that happens, press "Enable workflow" in the Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'   # every day, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            'https://gsfsyfeytrlmgbhdrunx.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_LwR8qCvWs6lLR1ALoTHCjw_9B4VQ-W8' \
            -H 'Content-Type: application/json' -d '{}')
          echo "Supabase answered $code"
          test "$code" = "200"
